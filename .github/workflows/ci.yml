name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A formatted diff is a review cost, so formatting is a build failure.
      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd ./internal)
          if [ -n "$out" ]; then echo "needs gofmt:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: build
        run: make build

      - name: version is stamped
        run: ./bin/knell version && ./bin/knell version --json

      # The contract cron depends on: a missing beacon must be a non-zero exit.
      # Each expected failure is captured with `|| rc=$?`, because `set -e` would
      # otherwise abort on the very exit code this step is asserting.
      - name: smoke
        run: |
          set -euo pipefail
          export KNELL_DB=$PWD/smoke.db KNELL_KEYS=$PWD/smoke-keys.json
          ./bin/knell init >/dev/null
          ./bin/knell add ci-smoke --period 10s --grace 1s
          ./bin/knell beat ci-smoke
          ./bin/knell check ci-smoke --quiet
          rc=0; ./bin/knell check --all --quiet || rc=$?
          [ "$rc" = "0" ] || { echo "healthy check should exit 0, got $rc"; exit 1; }
          sleep 12
          rc=0; ./bin/knell check ci-smoke --quiet || rc=$?
          [ "$rc" = "1" ] || { echo "silent check should exit 1, got $rc"; exit 1; }
          rc=0; ./bin/knell check no-such-check --quiet || rc=$?
          [ "$rc" = "2" ] || { echo "unknown check should exit 2, got $rc"; exit 1; }
          ./bin/knell status --json | head -5
          ./bin/knell alerts
          ./bin/knell verify
          rc=0; ./bin/knell ping || rc=$?
          [ "$rc" = "1" ] || { echo "ping with no server should exit 1, got $rc"; exit 1; }
          rm -f smoke.db* smoke-keys.json

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /tmp/knell ./cmd/knell
